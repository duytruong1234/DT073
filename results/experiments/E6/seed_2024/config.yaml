dataset:
  languages:
  - PHP
  - C
  - JavaScript
  - Python
  - Java
  - TypeScript
  - C++
  - Go
  - Ruby
  min_hunks_per_class: 500
  multi_cwe_policy: drop
  nonspecific_cwe:
  - NVD-CWE-Other
  - NVD-CWE-noinfo
  other_classes: drop
  top_k_cwe:
  - CWE-79
  - CWE-125
  - CWE-22
  - CWE-89
  - CWE-119
  - CWE-20
  - CWE-787
  - CWE-476
  - CWE-352
  - CWE-200
  - CWE-416
  - CWE-190
  - CWE-94
  - CWE-863
  - CWE-78
  - CWE-400
  - CWE-287
  version: v1.0.8
dedup:
  levels:
  - exact
  - normalized
  - near
  minhash_num_perm: 128
  near_jaccard: 0.9
  shingle_size: 3
hunks:
  drop_add_only: false
  drop_whitespace_only: true
  max_hunk_lines: 200
  min_changed_lines: 1
paths:
  db: data/db/CVEfixes.db
  interim: data/interim
  processed: data/processed
  reports: data/reports
  results: results
  zip: data/raw/CVEfixes_v1.0.8.zip
privacy:
  mask_emails: true
project: DT073
seeds:
- 42
- 123
- 2024
split:
  main: project
  project_leak_keys:
  - repo
  - cve
  - dup
  strategies:
  - random
  - project
  - time
  test_size: 0.2
  time_cutoff_year: 2023
  time_leak_keys:
  - cve
  - dup
  val_size: 0.1
validate:
  drop_merge_commits: true
  max_files_per_commit: 9
  max_lines_changed_per_file: 500
  require_before_and_after: true
  tangled_count: code_files
